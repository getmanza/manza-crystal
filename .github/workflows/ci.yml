name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The runner image's apt index goes stale when Ubuntu republishes a
      # package (libevent 404s); install-crystal installs with --no-upgrade.
      - run: sudo apt-get update -q
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Fetch cassettes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-cassettes.sh

      - name: crystal tool format --check
        run: crystal tool format --check

      - name: crystal spec
        run: crystal spec
