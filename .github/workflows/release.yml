name: Release

# Tag-driven release. Crystal shards have no central registry — consumers
# install straight from git tags, so "publishing" is: green specs + a
# version tag (matching shard.yml) + a GitHub release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The runner image's apt index goes stale when Ubuntu republishes a
      # package (libevent 404s); install-crystal installs with --no-upgrade.
      - run: sudo apt-get update -q
      - uses: crystal-lang/install-crystal@v1
      - name: Fetch cassettes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-cassettes.sh
      - run: crystal tool format --check
      - run: crystal spec

  github-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify tag matches shard version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG#v}"
          SHARD_VERSION=$(grep '^version:' shard.yml | awk '{print $2}')
          if [[ "$TAG_VERSION" != "$SHARD_VERSION" ]]; then
            echo "::error::Tag $TAG does not match shard.yml version $SHARD_VERSION" >&2
            exit 1
          fi
          if ! grep -qx "  VERSION = \"$TAG_VERSION\"" src/manza.cr; then
            echo "::error::src/manza.cr does not carry $TAG_VERSION (bin/release writes it via scripts/version)" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # bin/release creates the release (and the tag) itself; only a tag
        # pushed by hand reaches here without one.
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already published"
          else
            gh release create "$tag" --title "$tag" \
              --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
          fi
